<!DOCTYPE html>
<html>
  <head>
    <title>3D Raycast and Hit Animation</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        display: flex;
        flex-direction: column;
      }
      #plotContainer {
        display: flex;
        justify-content: space-between;
      }
      #orientationPlot,
      #hitPlot {
        width: 48%;
        height: 600px;
      }
      #controls {
        margin-bottom: 20px;
        text-align: center;
      }
      button {
        margin: 5px;
        padding: 10px;
        font-size: 16px;
      }
      #info {
        margin-top: 10px;
        font-size: 14px;
        color: #666;
        text-align: center;
      }
      #rangeControl {
        margin: 10px 0;
        text-align: center;
      }
      #rangeControl input {
        width: 60px;
        margin: 0 5px;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <h1>3D Raycast Orientation and Hit Animation</h1>
    <div id="controls">
      <button onclick="playAnimation()">Play</button>
      <button onclick="pauseAnimation()">Pause</button>
      <button onclick="resetAnimation()">Reset</button>
      <input
        type="range"
        id="frameSlider"
        min="1"
        max="1"
        value="1"
        oninput="goToFrame(this.value)"
        style="width: 300px"
      />
      <span id="frameInfo">Frame: 1/1</span>
    </div>
    <div id="rangeControl">
      <label for="rangeInput">Hit Plot Range:</label>
      <input
        type="number"
        id="rangeInput"
        value="10"
        min="1"
        max="100"
        step="1"
        onchange="updateRange(this.value)"
      />
      <span>(misses will appear on sphere of this radius)</span>
    </div>
    <div id="plotContainer">
      <div id="orientationPlot"></div>
      <div id="hitPlot"></div>
    </div>
    <div id="info">
      <p>Upload your raycast.json file:</p>
      <input
        type="file"
        id="fileInput"
        accept=".json"
        onchange="loadFile(event)"
      />
      <p id="status">No file loaded</p>
    </div>

    <script>
      let raycastData = [];
      let currentFrame = 1;
      let animationInterval = null;
      let isPlaying = false;

      // Configurable range parameter
      let HIT_PLOT_RANGE = 25;

      // Convert spherical coordinates to Cartesian
      function sphericalToCartesian(phi, theta, radius = 1) {
        return {
          x: radius * Math.sin(phi) * Math.cos(theta), // X (east/west)
          y: radius * Math.cos(phi), // Y (up/down)
          z: radius * Math.sin(phi) * Math.sin(theta), // Z (north/south)
        };
      }

      // Create unit sphere wireframe
      function createUnitSphere() {
        const points = [];
        for (let i = 0; i <= 20; i++) {
          for (let j = 0; j <= 40; j++) {
            const phi = (i / 20) * Math.PI;
            const theta = (j / 40) * 2 * Math.PI;
            points.push(sphericalToCartesian(phi, theta));
          }
        }

        return {
          type: "scatter3d",
          mode: "markers",
          x: points.map((p) => p.x),
          y: points.map((p) => p.y),
          z: points.map((p) => p.z),
          marker: {
            size: 1,
            color: "lightgray",
            opacity: 0.3,
          },
          name: "Unit Sphere",
          showlegend: false,
        };
      }

      // Create miss sphere wireframe at the edge of hit plot range
      function createMissSphere() {
        const points = [];
        for (let i = 0; i <= 15; i++) {
          for (let j = 0; j <= 30; j++) {
            const phi = (i / 15) * Math.PI;
            const theta = (j / 30) * 2 * Math.PI;
            points.push(sphericalToCartesian(phi, theta, HIT_PLOT_RANGE));
          }
        }

        return {
          type: "scatter3d",
          mode: "markers",
          x: points.map((p) => p.x),
          y: points.map((p) => p.y),
          z: points.map((p) => p.z),
          marker: {
            size: 1,
            color: "lightcoral",
            opacity: 0.2,
          },
          name: "Miss Sphere",
          showlegend: false,
        };
      }

      // Update both plots for given frame
      function updatePlots(frameNum) {
        if (raycastData.length === 0) return;

        const currentData = raycastData.slice(0, frameNum);

        // Orientation plot
        const orientationPoints = currentData.map((data) => {
          const [raycast] = data;
          return sphericalToCartesian(raycast.phi, raycast.theta);
        });

        const orientationTrace = {
          type: "scatter3d",
          mode: "markers",
          x: orientationPoints.map((p) => p.x),
          y: orientationPoints.map((p) => p.y),
          z: orientationPoints.map((p) => p.z),
          marker: {
            size: 4,
            color: orientationPoints.map((_, idx) => idx),
            colorscale: "Viridis",
            showscale: true,
            colorbar: {
              title: "Order",
            },
          },
          name: `Orientations (${frameNum}/${raycastData.length})`,
        };

        const orientationLayout = {
          title: `Orientation - Frame ${frameNum}/${raycastData.length}`,
          scene: {
            xaxis: { title: "X", range: [-1.2, 1.2] },
            yaxis: { title: "Y", range: [-1.2, 1.2] },
            zaxis: { title: "Z", range: [-1.2, 1.2] },
            aspectmode: "cube",
            camera: {
              up: { x: 0, y: 1, z: 0 },
              eye: { x: 1.5, y: 1.5, z: 1.5 },
            },
          },
          margin: { l: 0, r: 0, b: 0, t: 40 },
        };

        // Hit plot - separate hits and misses
        const hitPoints = [];
        const missPoints = [];

        currentData.forEach((data, idx) => {
          const [raycast] = data;
          if (raycast.hit !== null) {
            hitPoints.push({ point: raycast.hit, index: idx });
          } else {
            // Place miss on the scaled unit sphere
            const missPoint = sphericalToCartesian(
              raycast.phi,
              raycast.theta,
              HIT_PLOT_RANGE
            );
            missPoints.push({ point: missPoint, index: idx });
          }
        });

        const traces = [createMissSphere()];

        // Add hits trace
        if (hitPoints.length > 0) {
          const hitTrace = {
            type: "scatter3d",
            mode: "markers",
            x: hitPoints.map((h) => h.point.x),
            y: hitPoints.map((h) => h.point.y),
            z: hitPoints.map((h) => h.point.z),
            marker: {
              size: 6,
              color: hitPoints.map((h) => h.index),
              colorscale: "Viridis",
              showscale: true,
              colorbar: {
                title: "Order",
                x: 1.02,
              },
            },
            name: `Hits (${hitPoints.length})`,
          };
          traces.push(hitTrace);
        }

        // Add misses trace
        if (missPoints.length > 0) {
          const missTrace = {
            type: "scatter3d",
            mode: "markers",
            x: missPoints.map((m) => m.point.x),
            y: missPoints.map((m) => m.point.y),
            z: missPoints.map((m) => m.point.z),
            marker: {
              size: 2,
              color: missPoints.map((m) => m.index),
              colorscale: "Reds",
              symbol: "x",
              showscale: false,
              line: {
                width: 1,
                color: "red",
              },
              opacity: 0.2,
            },
            name: `Misses (${missPoints.length})`,
          };
          traces.push(missTrace);
        }

        const hitLayout = {
          title: `Raycast Results - Frame ${frameNum}/${raycastData.length} (Hits: ${hitPoints.length}, Misses: ${missPoints.length})`,
          scene: {
            xaxis: {
              title: "X",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            yaxis: {
              title: "Y",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            zaxis: {
              title: "Z",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            aspectmode: "cube",
            camera: {
              up: { x: 0, y: 1, z: 0 },
              eye: { x: 1.5, y: 1.5, z: 1.5 },
            },
          },
          margin: { l: 0, r: 0, b: 0, t: 40 },
        };

        // Update both plots
        Plotly.react(
          "orientationPlot",
          [createUnitSphere(), orientationTrace],
          orientationLayout
        );
        Plotly.react("hitPlot", traces, hitLayout);

        // Update UI
        document.getElementById("frameSlider").value = frameNum;
        document.getElementById(
          "frameInfo"
        ).textContent = `Frame: ${frameNum}/${raycastData.length}`;
        currentFrame = frameNum;
      }

      // Update range parameter
      function updateRange(newRange) {
        HIT_PLOT_RANGE = parseFloat(newRange);
        if (raycastData.length > 0) {
          updatePlots(currentFrame);
        }
      }

      // Load file
      function loadFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            raycastData = JSON.parse(e.target.result);
            console.log(`Loaded ${raycastData.length} raycast points`);

            // Update slider
            const slider = document.getElementById("frameSlider");
            slider.max = raycastData.length;
            slider.value = 1;

            // Update status
            document.getElementById(
              "status"
            ).textContent = `Loaded ${raycastData.length} raycast points`;

            // Create initial plots
            currentFrame = 1;
            updatePlots(1);
          } catch (error) {
            alert("Error loading file: " + error.message);
          }
        };
        reader.readAsText(file);
      }

      // Animation controls
      function playAnimation() {
        if (raycastData.length === 0) {
          alert("Please load a file first");
          return;
        }

        if (isPlaying) return;
        isPlaying = true;

        animationInterval = setInterval(() => {
          if (currentFrame >= raycastData.length) {
            pauseAnimation();
            return;
          }
          currentFrame++;
          updatePlots(currentFrame);
        }, 100); // 100ms per frame
      }

      function pauseAnimation() {
        isPlaying = false;
        if (animationInterval) {
          clearInterval(animationInterval);
          animationInterval = null;
        }
      }

      function resetAnimation() {
        pauseAnimation();
        currentFrame = 1;
        updatePlots(1);
      }

      function goToFrame(frameNum) {
        if (raycastData.length === 0) return;
        pauseAnimation();
        updatePlots(parseInt(frameNum));
      }

      // Initialize empty plots
      window.onload = function () {
        const orientationLayout = {
          title: "Orientation - Load a file to begin",
          scene: {
            xaxis: { title: "X", range: [-1.2, 1.2] },
            yaxis: { title: "Y", range: [-1.2, 1.2] },
            zaxis: { title: "Z", range: [-1.2, 1.2] },
            aspectmode: "cube",
            camera: {
              up: { x: 0, y: 1, z: 0 },
              eye: { x: 1.5, y: 1.5, z: 1.5 },
            },
          },
        };
        const hitLayout = {
          title: "Raycast Results - Load a file to begin",
          scene: {
            xaxis: {
              title: "X",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            yaxis: {
              title: "Y",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            zaxis: {
              title: "Z",
              range: [-HIT_PLOT_RANGE * 1.1, HIT_PLOT_RANGE * 1.1],
            },
            aspectmode: "cube",
            camera: {
              up: { x: 0, y: 1, z: 0 },
              eye: { x: 1.5, y: 1.5, z: 1.5 },
            },
          },
        };
        Plotly.newPlot(
          "orientationPlot",
          [createUnitSphere()],
          orientationLayout
        );
        Plotly.newPlot("hitPlot", [createMissSphere()], hitLayout);
      };
    </script>
  </body>
</html>
